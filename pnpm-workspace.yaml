packages:
  - "."
  - "datagouv-components"

onlyBuiltDependencies:
  - "@parcel/watcher"
  - "@scarf/scarf"
  - "@tailwindcss/oxide"
  - cypress
  - esbuild
  - husky
  - sharp

ignoredBuiltDependencies:
  - "@sentry/cli"
  - core-js
  - unrs-resolver

overrides:
  shell-quote: ^1.11.0
  flatted: ^3.4.2
  browserslist: ^4.28.7
  "@humanfs/node": ^0.16.8
  "@xmldom/xmldom": ^0.9.12
  axios: ^1.16.0
  lodash: ^4.18.1
  ws: ^8.21.0
  fast-uri: ^3.1.9
  tar: ^7.5.21
  protocol-buffers-schema: ^3.6.1
  brace-expansion@1: ^1.1.21
  brace-expansion@2: ^2.1.7
  brace-expansion@5: ^5.0.12
  postcss: ^8.5.23
  postcss-selector-parser@6: ^7.1.6
  postcss-selector-parser@7: ^7.1.6
  sharp: ^0.35.5
  ajv@8.17.1: ^8.18.0
  "@babel/core": ^7.29.6
  esbuild: ^0.28.1
  launch-editor: ^2.14.1
  js-yaml@3: ^3.15.1
  js-yaml@4: ^4.3.1
  nanoid@3: ^3.3.17
  dompurify: ^3.4.17
  # Single Vue for the whole workspace: without it the root importer (Nuxt) and
  # datagouv-components resolve different patches, and vue-tsc in
  # datagouv-components sees two unrelated @vue/runtime-core identities.
  vue: ^3.5.43
  devalue: ^5.9.4
  source-map-js: ^1.2.2
  serialize-javascript: ^7.1.3
  katex: ^0.18.2
  node-forge: ^1.4.1
  undici@6: ^6.29.1
  glob@10: ^14.0.2
  glob@13: ^14.0.2

# The Panoramax control of geopf only renders <pnx-viewer> and leaves loading the viewer
# to the app, which never uses that control: without this, pnpm installs the viewer and
# its own maplibre, three and photo-sphere-viewer.
packageExtensions:
  geopf-extensions-openlayers@1.0.0-beta.15:
    peerDependenciesMeta:
      "@panoramax/web-viewer":
        optional: true

# GetCapabilities strings (layer title, abstract, attribution, metadata/legend URLs)
# are rendered as HTML by the library: render them as text and only link http(s) URLs.
patchedDependencies:
  geopf-extensions-openlayers@1.0.0-beta.15: patches/geopf-extensions-openlayers@1.0.0-beta.15.patch
